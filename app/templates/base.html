<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}{{ title }}{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      max-width: 880px; margin: 2rem auto; padding: 0 1.25rem; line-height: 1.55;
    }
    header { border-bottom: 1px solid #8884; padding-bottom: .75rem; margin-bottom: 1.5rem; }
    h1 { font-size: 1.4rem; margin: 0; }
    .tag { font-size: .8rem; opacity: .7; }
    .card { border: 1px solid #8884; border-radius: 8px; padding: 1rem 1.25rem; margin: 1rem 0; }
    code { background: #8882; padding: .1rem .35rem; border-radius: 4px; }
  </style>
</head>
<body>
  <header>
    <h1>{{ title }}</h1>
    <div class="tag">Plan &rarr; guarded execution &rarr; human checkpoints &rarr; audit trace</div>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
